media:
  - name: product_images
    label: Product photos
    input: assets/products
    output: /assets/products
    extensions: [jpg, jpeg, png, webp]
  - name: brand_assets
    label: Brand assets
    input: assets
    output: /assets
    extensions: [jpg, jpeg, png, webp, svg]
content:
  - name: products
    label: Products
    type: file
    path: data/products.json
    format: json
    list: true
    fields:
      - name: id
        label: Product ID (unique number)
        type: number
        required: true
      - name: name
        label: Product name
        type: string
        required: true
      - name: category
        label: Category
        type: select
        required: true
        options:
          values: [matka-stand, kitchen-sink, chopping-board, plate-rack, dish-drainer, fruit-trolley, oven-stand, wall-hook-rack]
      - name: price
        label: Price in INR
        type: number
        required: true
      - name: gst
        label: GST rate (%) — website applies fixed 5%
        type: number
        required: true
      - name: description
        label: Product description
        type: text
      - name: tag
        label: Small tag (optional)
        type: string
      - name: icon
        label: Placeholder icon if no photo
        type: string
      - name: image
        label: Product photo path
        type: image
        options:
          media: product_images
          path: assets/products
          extensions: [jpg, jpeg, png, webp]
      - name: active
        label: Show product on website
        type: boolean
  - name: site_settings
    label: Website settings
    type: file
    path: data/site.json
    format: json
    fields:
      - name: slide1Image
        label: Slider Banner 1 Image
        type: image
        options:
          media: brand_assets
          path: assets
          extensions: [jpg, jpeg, png, webp]
      - name: slide1Title
        label: Slider Banner 1 Heading
        type: string
      - name: slide1Text
        label: Slider Banner 1 Text
        type: string
      - name: slide2Image
        label: Slider Banner 2 Image
        type: image
        options:
          media: brand_assets
          path: assets
          extensions: [jpg, jpeg, png, webp]
      - name: slide2Title
        label: Slider Banner 2 Heading
        type: string
      - name: slide2Text
        label: Slider Banner 2 Text
        type: string
      - name: slide3Image
        label: Slider Banner 3 Image
        type: image
        options:
          media: brand_assets
          path: assets
          extensions: [jpg, jpeg, png, webp]
      - name: slide3Title
        label: Slider Banner 3 Heading
        type: string
      - name: slide3Text
        label: Slider Banner 3 Text
        type: string
      - name: slide4Image
        label: Slider Banner 4 Image
        type: image
        options:
          media: brand_assets
          path: assets
          extensions: [jpg, jpeg, png, webp]
      - name: slide4Title
        label: Slider Banner 4 Heading
        type: string
      - name: slide4Text
        label: Slider Banner 4 Text
        type: string
      - name: announcement
        label: Top announcement bar
        type: string
      - name: heroEyebrow
        label: Homepage small heading
        type: string
      - name: heroTitleBefore
        label: Homepage main heading
        type: string
      - name: heroTitleAccent
        label: Homepage highlighted heading
        type: string
      - name: heroDescription
        label: Homepage description
        type: text
      - name: productsEyebrow
        label: Products small heading
        type: string
      - name: productsTitleBefore
        label: Products heading first line
        type: string
      - name: productsTitleAccent
        label: Products heading highlighted line
        type: string
      - name: productsIntro
        label: Products introduction
        type: text
      - name: aboutEyebrow
        label: About Us small heading
        type: string
      - name: aboutTitleBefore
        label: About Us heading first line
        type: string
      - name: aboutTitleAccent
        label: About Us highlighted line
        type: string
      - name: aboutText
        label: About Us full text
        type: text
      - name: contactTitle
        label: Contact heading
        type: string
      - name: contactText
        label: Contact description
        type: text
      - name: backgroundColor
        label: Main background color (hex)
        type: string
      - name: heroBackgroundColor
        label: Homepage background color (hex)
        type: string
      - name: accentColor
        label: Accent color (hex)
        type: string
      - name: headerBackgroundColor
        label: Header background color (hex)
        type: string
      - name: whatsappNumber
        label: WhatsApp number with country code
        type: string
      - name: logoPath
        label: Logo image path
        type: string
      - name: categories
        label: Category carousel configuration (JSON array)
        type: text
      - name: wholesaleBackgroundColor
        label: Legacy section background color (hex)
        type: string
      - name: pageTitle
        label: Browser page title
        type: string
      - name: metaDescription
        label: Search description
        type: text
